<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>
</head>

<body>

    <script>
        let list = {
            0: 'JavaScript',
            1: 'Symbol',
            length: 2
        };
        let message = ['Learning'].concat(list);
        console.log(message);

        let list2 = {
            0: 'JavaScript',
            1: 'Symbol',
            length: 2,
            [Symbol.isConcatSpreadable]: true
        };
        let message2 = ['Learning', 'Js'].concat(list2);
        console.log(message2); // ["Learning", "JavaScript", "Symbol"]
    </script>
</body>

</html>
